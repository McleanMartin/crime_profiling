{% extends "_layout.html" %}
{% block title %}Cases{% endblock title %}
{% block content %}
<div class="container-fluid bg-dark text-light min-vh-100 p-4">
    <div id="crime-list">
        {% include 'partials/crime_table.html' %}
    </div>
</div>
<div class="modal fade" id="myModalthree" role="dialog">
    <div class="modal-dialog modal-large">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">New Crime Case</h4>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <form method="post" action="{% url 'crime_create' %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            <strong>Error!</strong> Please correct the errors below.
                        </div>
                    {% endif %}
                    {{ form.as_p }}
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
