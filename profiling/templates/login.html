{% extends "partials/auth_layout.html" %}
{% block profiling %}
<div class="container col-xl-10 col-xxl-8 px-4 py-5 m-t-5">
  <div class="row align-items-center g-lg-5 py-5">
    <div class="col-md-10 mx-auto col-lg-5">
      {% if messages %}
          <div class="alert-container">
              {% for message in messages %}
                  <div class="alert alert-info">{{ message }}</div>
              {% endfor %}
          </div>
      {% endif %}
      <form class="p-4 p-md-5 border rounded-3 bg-light" method="post" action="{% url "index" %}">
          {% csrf_token %}
        <div class="form-floating mb-3">
          <input name="username" type="text" class="form-control" id="floatingInput" placeholder="name@example.com">
          <label for="floatingInput">Username</label>
        </div>
        <div class="form-floating mb-3">
          <input name="password" type="password" class="form-control" id="floatingPassword" placeholder="Password">
          <label for="floatingPassword">Password</label>
        </div>
        <button class="w-100 btn btn-lg btn-dark" type="submit">Login</button>
        <a href="{% url "public" %}" class="w-100 btn btn-lg btn-dark mt-3" >Public View</a>
        <hr class="my-4">
        <small class="text-muted">By clicking Login, you agree to the terms of use.</small>
      </form>
    </div>
  </div>
</div>
{% endblock profiling %}
