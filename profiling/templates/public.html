{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="{% static 'img/favicon.ico' %}">

    <title>Crime Profiling System</title>

    <!-- Bootstrap core CSS -->
    <link href="{% static 'css/cover.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/cover.css' %}" rel="stylesheet">

    <!-- Custom styles for this template -->
    <style>
        body {
            height: 100vh;
            background-image: url('{% static "images/bg.webp" %}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            text-shadow: 0 0.05rem 0.1rem rgba(0, 0, 0, 0.5);
        }
        .cover-container {
            max-width: 42em;
            margin: auto;
            padding: 0 1.5rem;
        }
        .masthead {
            margin-bottom: 2rem;
        }
        .masthead-brand {
            margin-bottom: 0;
        }
        .nav-masthead .nav-link {
            padding: 0.25rem 0;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            background-color: transparent;
            border-bottom: 0.25rem solid transparent;
        }
        .nav-masthead .nav-link:hover,
        .nav-masthead .nav-link:focus {
            border-bottom-color: rgba(255, 255, 255, 0.25);
        }
        .nav-masthead .nav-link + .nav-link {
            margin-left: 1rem;
        }
        .nav-masthead .active {
            color: #fff;
            border-bottom-color: #fff;
        }
        .cover {
            padding: 0 1.5rem;
        }
        .cover-heading {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .lead {
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 0.3rem;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .mastfoot {
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="text-center">
    <div class="cover-container d-flex h-100 p-3 mx-auto flex-column">
        <!-- Header -->
        <header class="masthead mb-auto">
            <div class="inner">
                <h3 class="masthead-brand">
                    <img class="mr-3" src="{% static "images/logo.png" %}" alt="" width="100" height="50">
                    IECMS
                </h3>
                <nav class="nav nav-masthead justify-content-center">
                    <a class="nav-link active" href="#">Home</a>
                    <a class="nav-link active" href="#">About</a>
                    <a class="nav-link active" href="#">Contact</a>
                    {% comment %} <a class="nav-link active" href="#">Court Rolls</a> {% endcomment %}
                    <a class="nav-link active" href="{% url "index" %}">Login</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main role="main" class="inner cover">
            <h1 class="cover-heading">
                Welcome to Integrated Electronic Case Management System
            </h1>
            <p class="lead">
                <a href="{% url "index" %}" class="btn btn-lg btn-secondary">Get Started</a>
            </p>
        </main>

        <!-- Footer -->
        <footer class="mastfoot mt-auto">
            <div class="inner">
                <p>Crime Profiling System &copy; 2025. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Bootstrap core JavaScript -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script>window.jQuery || document.write('<script src="{% static "js/vendor/jquery-slim.min.js" %}"><\/script>')</script>
    <script src="{% static 'js/vendor/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
