{% comment %} <!-- Court Roll Table -->
                <div class="data-table-area">
                    <div class="container">
                        <div class="row">
                            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                                <div class="data-table-list">
                                    <div class="basic-tb-hd">
                                        <h2>Court Rolls</h2>
                                    </div>
                                    <div class="table-responsive">
                                        <table id="data-table-basic" class="table table-striped">
                                            <thead>
                                                <tr>
                                                    <th scope="col">Case Number</th>
                                                    <th scope="col">First Hearing Date</th>
                                                    <th scope="col">Court Location</th>
                                                    <th scope="col">Next Hearing Date</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {% for case in cases %}
                                                    <tr>
                                                        <td>{{ case.crime.case_number }}</td>
                                                        <td>{{ case.hearing_date }}</td>
                                                        <td>{{ case.court_location }}</td>
                                                        <td>{{ case.next_hearing_date }}</td>
                                                    </tr>
                                                {% empty %}
                                                    <tr>
                                                        <td colspan="5" class="text-center">No upcoming cases found.</td>
                                                    </tr>
                                                {% endfor %}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div> {% endcomment %}
